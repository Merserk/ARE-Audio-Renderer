name: Windows build and audio contracts
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            platform: x64
          - architecture: x86
            platform: Win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure with the runner's current Visual Studio
        run: cmake -S . -B out/ci -A ${{ matrix.platform }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build out/ci --config Release --parallel
      - name: Audio and DirectShow contracts
        run: ctest --test-dir out/ci -C Release --output-on-failure
      - name: Package
        run: cmake --install out/ci --config Release --prefix dist/${{ matrix.architecture }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ARE-Audio-Renderer-${{ matrix.architecture }}
          path: dist/${{ matrix.architecture }}
          if-no-files-found: error
